# Default config. Override per environment by setting RUN_ENV=prod (loads config/prod.toml)
# or via env vars: PERPS_VENUE__HYPERLIQUID__API_URL=...

[venue.hyperliquid]
api_url = "https://api.hyperliquid-testnet.xyz"
ws_url = "wss://api.hyperliquid-testnet.xyz/ws"
testnet = true

# Spot token (quoted in USDC) bought to hedge each perp short. An asset with
# no entry here is never opened. Testnet spot books are mostly empty, so in
# dry-run the spot leg falls back to the perp mid when the spot quote is
# missing or more than 2% away.
[venue.hyperliquid.spot_tokens]
BTC = "UBTC"
ETH = "UETH"

[risk]
# Hard cap on per-asset notional in USD. Bot refuses to size larger.
max_position_usd = 1000
# Require this much buffer above liquidation price before opening / holding.
# 0.30 means liq price must be at least 30% away from mark.
liq_buffer_pct = 0.30
# Cap on effective leverage on the short leg.
max_leverage = 3

[strategy]
# Assets to monitor for funding opportunities.
assets = ["BTC", "ETH"]
# Both thresholds apply to the trailing mean below, not the latest hourly print.
# Annualized funding rate threshold for entering a hedged carry position.
min_funding_apy_to_enter = 0.10
# Annualized funding threshold below which we exit (avoid death-by-1000-cuts).
max_funding_apy_to_exit = 0.02
# Trailing window for the funding signal (168h = 7 days). Seeded from venue
# funding history at startup.
signal_window_hours = 168
# Hours of history required before the signal is trusted.
min_signal_hours = 168
# How often to re-evaluate entry/exit decisions.
decision_interval_seconds = 300

# Taker fees as a fraction of notional. Hyperliquid base tier.
[fees]
perp_taker = 0.00045
spot_taker = 0.0007

[telemetry]
log_level = "info"
state_dir = "state"
